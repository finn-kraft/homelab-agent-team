<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Team Control Center</title><link rel="stylesheet" href="/styles.css"></head>
<body><aside><div class="brand"><span class="logo">A</span><div><strong>Agent Team</strong><small>Control Center</small></div></div>
<nav><button data-view="dashboard" class="active">Overview</button><button data-view="projects">Projects</button><button data-view="agents">Agents</button><button data-view="events">Events</button></nav>
<div class="connection"><span id="liveDot"></span><span id="liveText">Disconnected</span></div></aside>
<main><header><div><h1 id="pageTitle">Overview</h1><p id="pageSubtitle">Your autonomous development team at a glance.</p></div><button class="primary" id="newJobButton">＋ New Job</button></header><div class="flow" aria-label="Autonomous workflow"><span class="stage">Planner</span><span class="arrow">→</span><span class="stage">Coder</span><span class="arrow">→</span><span class="stage">Reviewer</span><span class="arrow">→</span><span class="stage">Verification</span><span class="arrow">→</span><span class="stage">Commit</span></div>
<section id="login" class="login card"><h2>Connect securely</h2><p>Enter the Control Center API token configured on this server.</p><input id="token" type="password" autocomplete="current-password" placeholder="API token"><button class="primary" id="connect">Connect</button><p id="loginError" class="error"></p></section>
<div id="app" hidden><section id="dashboardView" class="view"></section><section id="projectsView" class="view" hidden></section><section id="agentsView" class="view" hidden></section><section id="eventsView" class="view" hidden></section><section id="jobView" class="view" hidden></section></div></main>
<dialog id="jobDialog"><form id="jobForm"><div class="dialog-head"><h2>Start a new job</h2><button type="button" class="icon" data-close>×</button></div><label>Project<select id="project" required></select></label><label>Goal<textarea id="goal" required minlength="10" placeholder="Read the roadmap and continuously implement the next appropriate unfinished work."></textarea></label><details><summary>Advanced settings</summary><label>Priority<input id="priority" type="number" value="0"></label><label>Maximum iterations<input id="maxIterations" type="number" min="1" value="100"></label></details><div class="actions"><button type="button" data-close>Cancel</button><button class="primary" type="submit">Start job</button></div></form></dialog>
<script src="/app.js"></script></body></html>
