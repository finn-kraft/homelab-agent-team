[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-routing-agent"
version = "0.1.0"
description = "Policy-driven router for a homelab agent fleet"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "uvicorn[standard]>=0.30"]

[project.scripts]
router = "routing_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
